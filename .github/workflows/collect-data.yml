name: Collect Data

on:
  schedule:
    # Mon-Fri 22:37 UTC (off the :00/:15/:30/:45 slots the live bot uses)
    - cron: '37 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Collect bars
      id: collect
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        SAXO_APP_KEY: ${{ secrets.SAXO_APP_KEY }}
        SAXO_APP_SECRET: ${{ secrets.SAXO_APP_SECRET }}
        PYTHONPATH: ${{ github.workspace }}
        LOG_LEVEL: "INFO"
      run: python research/collect_data.py

    - name: Commit new data
      if: always()
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "github-actions[bot]"
        git add -f data/collected/ 2>/dev/null || true
        git add state/ 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "Nothing new to commit"
        else
          git commit -m "Collect data [skip ci]"
          git pull --rebase
          git push
        fi

    - name: Telegram alert on failure
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="Collect Data workflow FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
