name: XAUUSD Live Trading Bot

on:
  schedule:
    # Run every 15 minutes (market hours: Mon-Fri, Sun 22:00+)
    - cron: '*/15 * * * *'

  workflow_dispatch:  # Allow manual trigger

jobs:
  scan-and-signal:
    name: Scan Market & Send Signals
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Live Bot Analysis
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      timeout-minutes: 5
      run: |
        python -c "
        import sys
        import os

        # Ensure repo root is in path
        sys.path.insert(0, os.getcwd())

        from src.main import TradingBot

        try:
            bot = TradingBot()

            # Check if market is open
            is_open, status = bot.is_market_open()
            print(f'Market Status: {status}')

            if is_open:
                print('Market is open - running analysis...')
                bot.run_analysis()
                print('Analysis complete')
            else:
                print(f'Market closed - skipping analysis')

            # Force cleanup and exit
            print('Cleaning up...')
            if hasattr(bot, 'telegram'):
                try:
                    bot.telegram.close()
                except:
                    pass

            print('✓ Bot finished successfully')
            sys.exit(0)

        except Exception as e:
            print(f'Error: {e}')
            import traceback
            traceback.print_exc()
            sys.exit(1)
        " || exit 1

    - name: Persist signal state
      # Commits the updated data/signal-dedup state back to the repo
      # so the next (stateless) run knows what was already sent, and
      # doesn't re-alert on the same setup. Requires "Read and write
      # permissions" for GITHUB_TOKEN under
      # Settings -> Actions -> General -> Workflow permissions.
      if: always()
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "github-actions[bot]"
        git add state/last_signals.json 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "No signal state changes to commit"
        else
          git commit -m "Update signal state [skip ci]"
          git push
        fi

    - name: Summary
      if: always()
      run: |
        echo "✅ Workflow completed"
        echo "Next scan in 15 minutes"
