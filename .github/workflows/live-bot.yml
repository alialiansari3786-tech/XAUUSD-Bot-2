name: XAUUSD Live Trading Bot

on:
  schedule:
    # Run every 15 minutes (market hours: Mon-Fri, Sun 22:00+)
    - cron: '*/15 * * * *'

  workflow_dispatch:  # Allow manual trigger

jobs:
  scan-and-signal:
    name: Scan Market & Send Signals
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Live Bot Analysis
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      timeout-minutes: 2
      run: |
        python -c "
        import sys
        import os
        import signal

        # Set 90-second alarm for entire bot run
        def timeout_handler(signum, frame):
            print('ERROR: Bot execution timed out after 90 seconds')
            sys.exit(1)

        signal.signal(signal.SIGALRM, timeout_handler)
        signal.alarm(90)

        # Ensure repo root is in path
        sys.path.insert(0, os.getcwd())

        from src.main import TradingBot

        try:
            bot = TradingBot()

            # Check if market is open
            is_open, status = bot.is_market_open()
            print(f'Market Status: {status}')

            if is_open:
                print('Market is open - running analysis...')
                bot.run_analysis()
                print('Analysis complete')
            else:
                print(f'Market closed - skipping analysis')

            # Force cleanup and exit
            print('Cleaning up...')
            signal.alarm(0)  # Cancel timeout alarm
            if hasattr(bot, 'telegram'):
                try:
                    bot.telegram.close()
                except:
                    pass

            print('✓ Bot finished successfully')
            sys.exit(0)

        except Exception as e:
            signal.alarm(0)  # Cancel timeout alarm
            print(f'Error: {e}')
            import traceback
            traceback.print_exc()
            sys.exit(1)
        " || exit 1

    - name: Summary
      if: always()
      run: |
        echo "✅ Workflow completed"
        echo "Next scan in 15 minutes"
